x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-MyTrek}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://mytrek.hanan.my}
  LOG_CHANNEL: stderr
  LOG_STACK: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_URL: ${DB_URL:-}
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-}
  DB_USERNAME: ${DB_USERNAME:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-MyTrek}}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

x-storage-volumes: &storage-volumes
  - app-storage:/var/www/html/storage/app
  - app-cache:/var/www/html/storage/framework/cache
  - app-sessions:/var/www/html/storage/framework/sessions
  - app-views:/var/www/html/storage/framework/views
  - app-logs:/var/www/html/storage/logs

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
    volumes:
      *storage-volumes
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || curl -fsS http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      *storage-volumes
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      *storage-volumes
    depends_on:
      - app

volumes:
  app-storage:
  app-cache:
  app-sessions:
  app-views:
  app-logs:
